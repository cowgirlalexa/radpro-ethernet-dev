; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
; Arduino-ESP32 3.x is required for the built-in SPI Ethernet/W5500 API.
; Pin 3.0.7 here because WiFiManager 2.0.17 remains stable on this core.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = waveshare-esp32-s3-eth
framework = arduino, espidf
board_build.filesystem = littlefs
board_build.filesystem_size = 0x200000
board_build.sdkconfig = sdkconfig.defaults
board_build.embed_txtfiles =
	managed_components/espressif__esp_insights/server_certs/https_server.crt
	managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
	managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
	managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt
monitor_speed = 115200
lib_deps = 
	tzapu/WiFiManager @ ^2.0.17
	knolleary/PubSubClient @ ^2.8
	bblanchon/ArduinoJson@^7.4.2
extra_scripts = 
	tools/copy_firmware.py
	tools/auto_uploadfs.py
	tools/create_ota_zip.py
build_unflags = 
	-fno-rtti
build_flags = 
	-fexceptions
	-D CORE_DEBUG_LEVEL=4
	-I ${PROJECT_DIR}/components/usb_host_vcp/include
	-I ${PROJECT_DIR}/components/usb_host_ch34x_vcp/include
	-DMBEDTLS_KEY_EXCHANGE__SOME__PSK_ENABLED
	-DMBEDTLS_KEY_EXCHANGE_SOME_PSK_ENABLED
	-DBRIDGE_FIRMWARE_VERSION=\"0.6.02\"
	-DRADPRO_WAVESHARE_ESP32_S3_ETH=1
	-DUSB_DEBUG_LOGS_ENABLED=0
	-DCONFIG_LITTLEFS_PAGE_SIZE=256
	-I ${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32s3/include/esp_littlefs/include
board_build.partitions = partitions.csv
upload_speed = 921600
upload_protocol = esptool
targets = buildprog, buildfs
